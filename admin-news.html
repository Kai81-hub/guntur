<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Admin News Post | Guntur Properties</title>
<meta name="robots" content="noindex, nofollow"/>

<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms"></script>

<style>
body{margin:0;font-family:Manrope,sans-serif;background:#f9f9ff;color:#151c27}
.btn-gold{background:linear-gradient(180deg,#ffe088,#d4af37);color:#241a00}
.panel-card{background:#fff;border:1px solid rgba(208,197,175,.45);border-radius:26px;box-shadow:0 15px 38px rgba(15,23,42,.06)}
.input{width:100%;border:1px solid #d0c5af;border-radius:16px;padding:14px;background:white}
</style>
</head>

<body>
<main class="max-w-5xl mx-auto px-5 py-10">
  <header class="panel-card p-6 mb-8 flex justify-between items-center gap-4">
    <div>
      <h1 class="text-3xl font-black">Admin News Post</h1>
      <p class="text-[#476080]">Post news and updates with Cloudinary photo upload.</p>
    </div>
    <a href="admin-panel.html" class="px-5 py-3 rounded-2xl border border-[#d0c5af] font-black text-[#735c00]">Back to Admin</a>
  </header>

  <section class="panel-card p-6">
    <form id="news-form" class="grid gap-4">
      <input id="news-title" class="input" placeholder="News title" required/>

      <select id="news-category" class="input">
        <option value="market-trends">Market Trends</option>
        <option value="registration-updates">Registration Updates</option>
        <option value="local-updates">Local Updates</option>
        <option value="guntur-real-estate-news">Guntur Real Estate News</option>
        <option value="buying-guide">Buying Guide</option>
        <option value="rental-guide">Rental Guide</option>
        <option value="general">General</option>
      </select>

      <textarea id="news-summary" class="input" rows="3" placeholder="Short summary"></textarea>
      <textarea id="news-content" class="input" rows="9" placeholder="Full news content" required></textarea>

      <div class="rounded-2xl border border-[#d0c5af] p-4 bg-[#f9f9ff]">
        <label class="font-black text-[#735c00] block mb-2">News Photo</label>
        <input id="news-photo" type="file" accept="image/*" class="input"/>
        <p class="text-sm text-[#476080] mt-2">Photo uploads automatically to Cloudinary.</p>
      </div>

      <button class="btn-gold py-4 rounded-2xl font-black text-lg">Publish News</button>
    </form>

    <p id="news-status" class="mt-4 text-[#476080] font-bold"></p>
  </section>
</main>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
const SUPABASE_URL = "https://mpuwfytcyjrsdkgaqaip.supabase.co";
const SUPABASE_KEY = "sb_publishable_Cw3RO0xumC7MRdfOt16HBQ_Ae6PpWOK";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const CLOUDINARY_CLOUD_NAME = "dlzmuyuxo";
const CLOUDINARY_UPLOAD_PRESET = "guntur_unsigned";

function getAuthRole(){
  return localStorage.getItem("gp_auth_role") || "user";
}

function getAuthPhone(){
  return localStorage.getItem("gp_auth_phone") || "";
}
function slugify(text){
  return String(text || "")
    .toLowerCase()
    .replace(/&/g, "and")
    .replace(/\s+/g, "-")
    .replace(/[^a-z0-9-]/g, "")
    .replace(/-+/g, "-")
    .replace(/^-|-$/g, "");
}
function checkAdmin(){
  const role = getAuthRole();
  const phone = getAuthPhone();
  if(!phone){
    location.href = "login.html";
    return false;
  }
  if(role !== "admin"){
    document.body.innerHTML = `<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;font-family:Manrope,sans-serif">
      <div style="background:white;border:1px solid #d0c5af;border-radius:28px;padding:34px;text-align:center">
        <h1>Access Denied</h1>
        <p>Only admin can post news.</p>
        <a href="index.html">Go Home</a>
      </div>
    </div>`;
    return false;
  }
  return true;
}
async function uploadToCloudinary(file){
  if(!file) return null;
  const formData = new FormData();
  formData.append("file", file);
  formData.append("upload_preset", CLOUDINARY_UPLOAD_PRESET);
  formData.append("folder", "guntur-properties/news");
  const response = await fetch(
    `https://api.cloudinary.com/v1_1/${CLOUDINARY_CLOUD_NAME}/image/upload`,
    { method:"POST", body:formData }
  );
  const result = await response.json();
  if(!response.ok){
    throw new Error(result.error?.message || "Cloudinary upload failed.");
  }
  return {
    url: result.secure_url,
    publicId: result.public_id
  };
}
async function publishNews(event){
  event.preventDefault();
  const status = document.getElementById("news-status");
  status.textContent = "Publishing news...";
  try{
    const title = document.getElementById("news-title").value.trim();
    const category = document.getElementById("news-category").value;
    const summary = document.getElementById("news-summary").value.trim();
    const content = document.getElementById("news-content").value.trim();
    const photo = document.getElementById("news-photo").files[0] || null;
    if(!title || !content){
      status.textContent = "Title and content are required.";
      return;
    }
    let uploaded = null;
    if(photo){
      status.textContent = "Uploading photo to Cloudinary...";
      uploaded = await uploadToCloudinary(photo);
    }
    status.textContent = "Saving news to Supabase...";
    const payload = {
      title,
      slug: slugify(title),
      category,
      summary,
      content,
      image_url: uploaded?.url || null,
      cloudinary_public_id: uploaded?.publicId || null,
      status: "published",
      posted_by_phone: getAuthPhone()
    };
    const { error } = await supabaseClient
      .from("news_updates")
      .insert(payload);
    if(error) throw error;
    status.textContent = "News published successfully.";
    document.getElementById("news-form").reset();
    setTimeout(() => {
      location.href = "news.html";
    }, 1000);
  }catch(error){
    console.error(error);
    status.textContent = error.message || "Unable to publish news.";
  }
}
document.addEventListener("DOMContentLoaded", () => {
  if(!checkAdmin()) return;
  document.getElementById("news-form").addEventListener("submit", publishNews);
});
</script>
</body>
</html>
